upstream web_app {
    server web:8000;
}

server {
    listen 80;
    server_name _; # Thay thế '_' bằng domain của bạn nếu có (vd: example.com)

    location / {
        proxy_pass http://web_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Lưu ý: Việc phục vụ static files đã được WhiteNoise xử lý ngay bên trong Gunicorn,
    # nên Nginx không cần cấu hình alias cho thư mục static nữa.
}
