services:
  db:
    image: mysql:8.0
    container_name: aurashop_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: thaochie
      MYSQL_DATABASE: DACN
      MYSQL_USER: thaochie
      MYSQL_PASSWORD: thaochie
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "thaochie", "-pthaochie"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: ./web
    container_name: aurashop_web
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=DACN
      - DB_USER=thaochie
      - DB_PASSWORD=thaochie
      - AI_SERVICE_BASE_URL=http://host.docker.internal:8000
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=*
    volumes:
      - ./web:/app
      - chroma_data:/app/chroma_db
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"

  nginx:
    image: nginx:alpine
    container_name: aurashop_nginx
    restart: always
    ports:
      - "80:80"
      # - "443:443" # Bỏ comment khi bạn có chứng chỉ SSL
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  mysql_data:
  chroma_data:
