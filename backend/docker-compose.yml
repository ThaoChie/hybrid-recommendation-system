version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: aurashop_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: thaochie
      MYSQL_DATABASE: DACN             
      MYSQL_USER: thaochie
      MYSQL_PASSWORD: thaochie
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: